name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --windowed --onefile --collect-all rawpy --icon assets/photobatch.ico --add-data "assets;assets" --name PhotoBatch app.py
      - name: Verify packaged executable
        run: python -c "import subprocess; subprocess.run(['dist/PhotoBatch.exe', '--self-test'], check=True, timeout=120)"
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoBatch-Windows-x64
          path: dist/PhotoBatch.exe
          if-no-files-found: error
      - name: Publish EXE download
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/PhotoBatch.exe --title "PhotoBatch ${{ github.ref_name }}" --notes "Windows 64-bit photo converter. Download PhotoBatch.exe. No Python installation required. Unsigned executable; Windows SmartScreen may request confirmation."
